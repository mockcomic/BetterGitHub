  <circle cx="196" cy="354" r="12" fill="#0b1120" />
  <rect x="120" y="226" width="304" height="60" rx="22" fill="#e9e2cf" />
  <circle cx="166" cy="256" r="12" fill="#0b1120" />
  <circle cx="212" cy="256" r="12" fill="#0b1120" />
  <rect x="136" y="128" width="304" height="60" rx="22" fill="#e9e2cf" />
