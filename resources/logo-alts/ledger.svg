<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    ALT 8 — "Ledger". History as a physical deck: three punched-card edges
    stacked and squared off on the dark desk, each with its column holes
    printed. The top card carries the head commit, punched and inked blue at
    the right end of its row — newest record on top, which is exactly what
    the app shows you.
  -->
